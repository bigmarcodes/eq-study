<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EQ Study</title>
<style>
:root{--bg:#f4f5f7;--fg:#1c2128;--mut:#5b6672;--box:#fff;--bd:#d0d5db;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d0f12;--fg:#e6eaee;--mut:#8b96a3;--box:#1a1e24;--bd:#2c323a}}
:root[data-theme="dark"]{--bg:#0d0f12;--fg:#e6eaee;--mut:#8b96a3;--box:#1a1e24;--bd:#2c323a}
html{color-scheme:light dark}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
.app{max-width:900px;margin:0 auto;padding:12px}
.plugin{background:#15181c;color:#fff;border-radius:8px;overflow:hidden;border:1px solid var(--bd)}
.bar{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;padding:10px;background:#23282f}
.bar label{font-size:13px}
input,select,button{font:inherit;border-radius:4px;border:1px solid #3b434d;background:#2c323a;color:#fff;padding:5px 9px}
input[type=text]{width:84px}
button{cursor:pointer}button:disabled,input:disabled,select:disabled{opacity:.45;cursor:default}
button.on{background:#b9a2ff;color:#000;border-color:#b9a2ff}
.seg{display:flex;gap:0}.seg button:first-child{border-radius:4px 0 0 4px}.seg button:last-child{border-radius:0 4px 4px 0}
.sp{flex:1}#timer{font-variant-numeric:tabular-nums;min-width:62px;text-align:center}
canvas{display:block;width:100%;height:auto;touch-action:none;user-select:none}
.audio{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;padding:10px;background:#23282f;font-size:13px}
.note{color:var(--mut);margin:10px 2px;font-size:13px}
textarea{width:100%;height:150px;box-sizing:border-box;background:var(--box);color:var(--fg);border:1px solid var(--bd);border-radius:4px;font:12px ui-monospace,monospace}
.tools{display:flex;gap:8px;align-items:center;margin-top:8px}.tools button{background:var(--box);color:var(--fg);border-color:var(--bd)}

[hidden]{display:none!important}
.app{max-width:1220px}
#study{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:12px;align-items:start}
@media(max-width:820px){#study{grid-template-columns:1fr}}
#side{background:var(--box);border:1px solid var(--bd);border-radius:8px;padding:12px}
#chk{list-style:none;padding:0;margin:8px 0}#chk li.ok{color:#2e9e5b}
#ov{position:fixed;inset:0;overflow:auto;background:var(--bg);z-index:9;padding:env(safe-area-inset-top,0px) 12px}
#ov.modal{background:rgba(0,0,0,.6)}
#card{background:var(--box);max-width:640px;margin:24px auto;padding:20px;border-radius:10px;border:1px solid var(--bd)}
.lk{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0}.lk label{text-align:center;font-size:12px}.lk span{font-size:12px;color:var(--mut)}
</style></head><body><div class="app"><div id="study"><div><div class="plugin">
 <div class="bar">
  <b id="lay"></b><input type="text" id="pid" hidden><label hidden><select id="tid"><option value="1">Task 1</option><option value="2">Task 2</option><option value="3">Task 3</option><option value="4">Task 4</option></select></label>
  <button id="start">Start</button><span id="timer">00:00.0</span><span class="sp"></span>
  <div class="seg" hidden><button id="LA" class="on">Layout A</button><button id="LB">Layout B</button></div>
  <button id="reset">Reset</button><button id="lock">Lock In</button>
 </div>
 <canvas id="cv" width="900" height="564"></canvas>
 <div class="audio">
  <button id="play">▶ Play</button>
  <select id="srcSel" hidden><option value="noise">Pink noise</option><option value="file">Audio file</option></select>
  <input type="file" id="file" accept="audio/*" hidden>
  <label>Volume <input type="range" id="vol" min="0" max="1" step="0.01" value="0.5"></label>
 </div>
</div>
</div><aside id="side"><b id="ttl"></b><p id="ins"></p><ul id="chk"></ul><p class="note" id="status">Pick a source, press Play, then Start a task. Data is logged in this page; use “Show CSV” to copy it.</p>
<div class="tools" hidden><button id="showcsv">Show CSV</button><button id="copycsv">Copy CSV</button><button id="clearlog">Clear log</button></div>
<textarea id="csv" hidden readonly></textarea></aside></div><div id="ov" hidden><div id="card"></div></div>
</div>
<script>
"use strict";
/* ===== shared constants (EQShared.h) ===== */
const W=900,H=564,MINF=20,MAXF=20000,MING=-12,MAXG=12,MINQ=.3,MAXQ=10;
const DOT=10,QDOT=6,HIT=14,MINEXT=32,BASEFRAC=.46,DEPTH=.6,WALLHALF=300,BHS=1.6,STICK=52,STICKC=96,BODYPX=8;
const COL={bg:'#15181c',grid:'#2c323a',text:'#8b96a3',curve:'#e8edf2',def:'#2f8460',hov:'#ffd166',sel:'#b9a2ff'};
const PFX=['hp','bell1','bell2','lp'],KN={f:'freq',g:'gain',q:'q'},DEF=[{f:20},{f:250,g:0,q:1},{f:2500,g:0,q:1},{f:20000}];
const isBell=b=>b===1||b===2,cl=(v,a,b)=>Math.min(b,Math.max(a,v));
const fNorm=f=>cl(Math.log(f/MINF)/Math.log(MAXF/MINF),0,1),normF=n=>MINF*Math.pow(MAXF/MINF,cl(n,0,1));
const gNorm=g=>(cl(g,MING,MAXG)-MING)/(MAXG-MING),normG=n=>MING+cl(n,0,1)*(MAXG-MING);
const bwOct=q=>2*Math.asinh(1/(2*q))/Math.LN2;
const qFromBw=o=>cl(1/(2*Math.sinh(Math.max(o,1e-4)*Math.LN2*.5)),MINQ,MAXQ);
const dScale=g=>{g=cl(g,MING,MAXG);return g>=0?1+g/MAXG*DEPTH:1+g/MING*-DEPTH};
const dAlpha=g=>.3+gNorm(g)*.7;
const fmtF=f=>f>=1000?(f/1000).toFixed(2)+' kHz':f.toFixed(f<100?1:0)+' Hz';
const fmtG=g=>(g>=0?'+':'')+g.toFixed(1)+' dB',axF=f=>f>=1000?(f/1000|0)+'k':''+f;
const rgba=(h,a)=>{const n=parseInt(h.slice(1),16);return`rgba(${n>>16},${n>>8&255},${n&255},${a})`};
const lt=(h,k)=>{const n=parseInt(h.slice(1),16),m=c=>Math.round(c+(255-c)*k);return`rgb(${m(n>>16)},${m(n>>8&255)},${m(n&255)})`};

/* ===== model + audio (replaces PluginProcessor) ===== */
const bands=DEF.map(d=>({...d}));
const AC=new(window.AudioContext||window.webkitAudioContext)();
const mk=t=>{const n=AC.createBiquadFilter();n.type=t;return n};
const N=[mk('highpass'),mk('peaking'),mk('peaking'),mk('lowpass')];
N[0].Q.value=N[3].Q.value=-3.0103;           // Web Audio HP/LP Q is in dB: -3.01 dB = Butterworth 0.7071, matching the JUCE filters
const inG=AC.createGain(),outG=AC.createGain();outG.gain.value=.5;
inG.connect(N[0]);N[0].connect(N[1]);N[1].connect(N[2]);N[2].connect(N[3]);N[3].connect(outG);outG.connect(AC.destination);
function applyNode(b,imm){const t=AC.currentTime,n=N[b],v=bands[b],now=imm||AC.state!=='running';
 const set=(p,x)=>{if(now){p.cancelScheduledValues(0);p.value=x}else p.setTargetAtTime(x,t,.01)};
 set(n.frequency,v.f);if(isBell(b)){set(n.gain,v.g);set(n.Q,v.q)}}
bands.forEach((_,i)=>applyNode(i,true));
const sr=()=>AC.sampleRate;
function respDb(i,fr){const v=bands[i],s=sr(),w0=2*Math.PI*cl(v.f,1e-3,s/2)/s,c=Math.cos(w0),sn=Math.sin(w0);
 let b0,b1,b2,a0,a1,a2;
 if(isBell(i)){const A=Math.pow(10,v.g/40),al=sn/(2*v.q);b0=1+al*A;b1=-2*c;b2=1-al*A;a0=1+al/A;a1=-2*c;a2=1-al/A}
 else{const al=sn/(2*Math.pow(10,-3.0103/20));a0=1+al;a1=-2*c;a2=1-al;
  if(i===0){b0=(1+c)/2;b1=-(1+c);b2=b0}else{b0=(1-c)/2;b1=1-c;b2=b0}}
 return Array.from(fr,f=>{const w=2*Math.PI*cl(f,0,s/2)/s,cw=Math.cos(w),sw=Math.sin(w),c2=Math.cos(2*w),s2=Math.sin(2*w),
  nr=b0+b1*cw+b2*c2,ni=-(b1*sw+b2*s2),dr=a0+a1*cw+a2*c2,di=-(a1*sw+a2*s2);
  return 20*Math.log10(Math.max(Math.sqrt((nr*nr+ni*ni)/(dr*dr+di*di)),1e-5))})}
// sources
let noiseBuf=(()=>{const n=AC.sampleRate*8,b=AC.createBuffer(1,n,AC.sampleRate),d=b.getChannelData(0);
 let a=0,b1=0,c=0,e=0,f=0,g=0,h=0;for(let i=0;i<n;i++){const w=Math.random()*2-1;
 a=.99886*a+w*.0555179;b1=.99332*b1+w*.0750759;c=.969*c+w*.153852;e=.8665*e+w*.3104856;f=.55*f+w*.5329522;g=-.7616*g-w*.016898;
 d[i]=(a+b1+c+e+f+g+h+w*.5362)*.11;h=w*.115926}return b})();
let fileBuf=null,src=null,playing=false;
const $=id=>document.getElementById(id);
function startSrc(){stopSrc();const buf=$('srcSel').value==='file'&&fileBuf?fileBuf:(curBuf||noiseBuf);
 src=AC.createBufferSource();src.buffer=buf;src.loop=true;src.connect(inG);src.start()}
function stopSrc(){if(src){try{src.stop()}catch(e){}src.disconnect();src=null}}
$('play').onclick=async()=>{await AC.resume();playing=!playing;playing?startSrc():stopSrc();$('play').textContent=playing?'■ Stop':'▶ Play'};
$('srcSel').onchange=()=>{if(playing)startSrc()};
$('vol').oninput=e=>outG.gain.value=+e.target.value;
$('file').onchange=async e=>{const f=e.target.files[0];if(!f)return;
 try{fileBuf=await AC.decodeAudioData(await f.arrayBuffer());$('srcSel').value='file';if(playing)startSrc();$('status').textContent='Loaded '+f.name}
 catch(err){$('status').textContent='Could not decode that file.'}};

/* ===== study logger (StudyLogger) ===== */
const HEAD='timestamp_ms,participant_id,layout,task_id,event_type,band_index,zone,param,old_value,new_value,variant,pair_position';
const L={pid:'',tid:'1',layout:'A',running:false,t0:0,last:0,drags:0,pc:0,rs:0,variant:'',pos:'',st:'',ei:0,rows:[],pend:{},lw:{}};

const cq=s=>/[,"\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;
const saveRows=()=>{try{localStorage.setItem('eqstudy_rows',JSON.stringify(L.rows))}catch(e){}};
function row(type,band,zone,param,o,n,at){const t=Math.round((at??Date.now())-L.t0);
 L.rows.push([t,L.pid,L.layout,L.tid,type,band>=0?band+1:'',zone||'',param||'',o??'',String(n??''),L.variant,L.pos])}
function wPend(k){const p=L.pend[k];row('PARAM_CHANGE',p.band,p.zone,p.param,p.o.toFixed(3),p.n.toFixed(3),p.at);L.pc++;L.lw[k]=Date.now();p.valid=false}
function flush(){for(const k in L.pend)if(L.pend[k].valid)wPend(k)}
function ev(type,band=-1,zone='',param=''){if(!L.running)return;if(type==='RESET')L.rs++;flush();if(type==='DRAG_START')L.drags++;row(type,band,zone,param)}
function logParam(band,zone,param,o,n){if(!L.running)return;const k=band+':'+param,now=Date.now();
 const p=L.pend[k]||(L.pend[k]={valid:false});if(!p.valid)Object.assign(p,{valid:true,band,zone,param,o});p.n=n;p.at=now;
 if(now-(L.lw[k]||0)>=50)wPend(k)}
function describe(){const a=[];bands.forEach((v,b)=>['f','g','q'].forEach(k=>{if(v[k]!==undefined)a.push(PFX[b]+'_'+KN[k]+'='+v[k].toFixed(3))}));return a.join(';')}

/* ===== interaction base (EQGraphBase) ===== */
let layout='A',sel=-1,hover={band:-1,zone:'NONE',side:0},drag=null,dragging=false,grab={x:0,y:0};
const NONE={band:-1,zone:'NONE',side:0};
const same=(a,b)=>a.band===b.band&&a.zone===b.zone&&a.side===b.side;
const active=()=>dragging?drag:hover;
function setValue(b,k,v){const lim={f:[MINF,MAXF],g:[MING,MAXG],q:[MINQ,MAXQ]}[k];v=cl(v,lim[0],lim[1]);
 const old=bands[b][k];if(Math.abs(v-old)<1e-4)return;bands[b][k]=v;applyNode(b);logParam(b,drag?drag.zone:'',KN[k],old,v)}
function resetAll(){ev('RESET');if(sel!==-1){sel=-1;ev('BAND_SELECT',-1,'NONE','selection')}
 bands.forEach((v,b)=>['f','g','q'].forEach(k=>{if(v[k]===undefined)return;const d=DEF[b][k],o=v[k];if(Math.abs(d-o)<1e-4)return;
  v[k]=d;applyNode(b);logParam(b,'RESET',KN[k],o,d)}));hover=NONE;drag=null;dragging=false;draw();requestAnimationFrame(draw)}
const cv=$('cv'),ctx=cv.getContext('2d');
const dpr=Math.max(1,window.devicePixelRatio||1);cv.width=W*dpr;cv.height=H*dpr;
const pos=e=>{const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}};
const hitTest=p=>layout==='A'?hitA(p):hitB(p),applyDrag=p=>layout==='A'?dragA(p):dragB(p);
cv.addEventListener('pointermove',e=>{if(dragging){applyDrag({x:pos(e).x-grab.x,y:pos(e).y-grab.y});draw();return}
 const h=hitTest(pos(e));if(!same(h,hover)){hover=h;draw()}});
cv.addEventListener('pointerleave',()=>{if(!dragging){hover=NONE;draw()}});
cv.addEventListener('pointerdown',e=>{if(!canAct())return;const p=pos(e),h=hitTest(p);
 if(h.zone==='NONE'){if(sel!==-1){sel=-1;ev('BAND_SELECT',-1,'NONE','selection')}dragging=false;drag=null;draw();return}
 if(h.band!==sel){sel=h.band;ev('BAND_SELECT',h.band,h.zone,'selection')}
 drag=h;dragging=true;grab={x:p.x-h.hx,y:p.y-h.hy};cv.setPointerCapture(e.pointerId);ev('DRAG_START',h.band,h.zone);draw()});
const up=e=>{if(!dragging)return;ev('DRAG_END',drag.band,drag.zone);dragging=false;drag=null;hover=hitTest(pos(e));draw()};
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);

/* ===== drawing helpers ===== */
const T=(s,x,y,al='left',font='12px system-ui,sans-serif',c=COL.text)=>{ctx.font=font;ctx.fillStyle=c;ctx.textAlign=al;ctx.textBaseline='middle';ctx.fillText(s,x,y)};
const LN=(x1,y1,x2,y2,c,w=1)=>{ctx.strokeStyle=c;ctx.lineWidth=w;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke()};
const CIR=(x,y,r,f)=>{ctx.fillStyle=f;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill()};
function dot(x,y,r,f,label){ctx.save();ctx.shadowColor='rgba(0,0,0,.5)';ctx.shadowBlur=6;ctx.shadowOffsetY=2;const gr=ctx.createLinearGradient(x,y-r,x,y+r);gr.addColorStop(0,lt(f,.22));gr.addColorStop(1,f);CIR(x,y,r,gr);ctx.restore();ctx.strokeStyle='rgba(0,0,0,.45)';ctx.lineWidth=1.25;ctx.stroke();T(label,x,y+.5,'center','11px system-ui,sans-serif',f===COL.def?'#fff':'#000')}
function ring(x,y,r){ctx.strokeStyle=COL.sel;ctx.lineWidth=2;ctx.beginPath();ctx.arc(x,y,r+3,0,7);ctx.stroke()}
function box(x,y,w,h,lines,fs){ctx.fillStyle='rgba(35,40,47,.93)';ctx.beginPath();ctx.roundRect(x,y,w,h,5);ctx.fill();ctx.strokeStyle=COL.sel;ctx.lineWidth=1;ctx.stroke();
 lines.forEach((s,i)=>T(s,x+8,y+4+fs*1.3*(i+.5)+ (fs>11?1:0),'left',fs+'px system-ui,sans-serif','#fff'))}
function path(xs,ys){ctx.beginPath();xs.forEach((x,i)=>i?ctx.lineTo(x,ys[i]):ctx.moveTo(x,ys[i]))}
const readLines=b=>{const v=bands[b],a=['Freq  '+fmtF(v.f)];if(isBell(b))a.push('Gain  '+fmtG(v.g),'Q  '+v.q.toFixed(2));return a};
const FREQS=[20,50,100,200,500,1000,2000,5000,10000,20000];

/* ===== Layout A: horizontal ===== */
const AA={x:56,y:14,w:W-80,h:H-48},ppoA=AA.w/Math.log2(MAXF/MINF);
const fx=f=>AA.x+fNorm(f)*AA.w,xf=x=>normF((x-AA.x)/AA.w),gy=g=>AA.y+AA.h-gNorm(g)*AA.h,yg=y=>normG((AA.y+AA.h-y)/AA.h);
const posA=b=>({x:fx(bands[b].f),y:gy(isBell(b)?bands[b].g:0)});
const qOffA=b=>MINEXT+.5*bwOct(bands[b].q)*ppoA;
function hitA(p){
 if(isBell(sel)){const c=posA(sel),o=qOffA(sel);for(const s of[-1,1]){const x=c.x+s*o;if(Math.hypot(x-p.x,c.y-p.y)<=HIT)return{band:sel,zone:'Q_HANDLE',side:s,hx:x,hy:c.y}}}
 let best=-1,bs=1e9;for(let b=0;b<4;b++){const c=posA(b),d=Math.hypot(c.x-p.x,c.y-p.y);if(d>HIT)continue;const s=d-(b===sel?3:0);if(s<bs){bs=s;best=b}}
 if(best>=0){const c=posA(best);return{band:best,zone:isBell(best)?'BODY':'HP_LP_HANDLE',side:0,hx:c.x,hy:c.y}}
 return NONE}
function dragA(p){const b=drag.band;
 if(drag.zone==='BODY'){setValue(b,'f',xf(p.x));setValue(b,'g',yg(p.y))}
 else if(drag.zone==='HP_LP_HANDLE')setValue(b,'f',xf(p.x));
 else if(drag.zone==='Q_HANDLE'){const dist=drag.side*(p.x-fx(bands[b].f)),half=Math.max(0,dist-MINEXT);setValue(b,'q',qFromBw(2*half/ppoA))}}
function drawA(){
 const pg=ctx.createLinearGradient(0,AA.y,0,AA.y+AA.h);pg.addColorStop(0,'#1c2128');pg.addColorStop(1,'#111418');ctx.fillStyle=pg;ctx.beginPath();ctx.roundRect(AA.x,AA.y,AA.w,AA.h,6);ctx.fill();
 const GR='rgba(255,255,255,.07)';
 FREQS.forEach(f=>{const x=fx(f);LN(x,AA.y,x,AA.y+AA.h,GR);T(axF(f),x,AA.y+AA.h+14,'center')});
 [12,6,0,-6,-12].forEach(g=>{const y=gy(g);LN(AA.x,y,AA.x+AA.w,y,g===0?'#4a525c':GR,g===0?2:1);T((g>0?'+':'')+g,AA.x-8,y,'right')});
 ctx.strokeStyle=COL.grid;ctx.lineWidth=1;ctx.beginPath();ctx.roundRect(AA.x,AA.y,AA.w,AA.h,6);ctx.stroke();
 // response curves (from the real BiquadFilterNodes)
 const xs=[];for(let x=AA.x;x<=AA.x+AA.w+.5;x+=2)xs.push(x);
 const fr=Float32Array.from(xs,x=>Math.min(xf(x),sr()*.499)),R=[0,1,2,3].map(i=>respDb(i,fr));
 ctx.save();ctx.beginPath();ctx.rect(AA.x,AA.y,AA.w,AA.h);ctx.clip();
 if(isBell(sel)){const ys=R[sel].map(gy);path(xs,ys);ctx.lineTo(xs[xs.length-1],gy(0));ctx.lineTo(xs[0],gy(0));ctx.closePath();ctx.fillStyle=rgba(COL.sel,.22);ctx.fill();
  path(xs,ys);ctx.strokeStyle=COL.sel;ctx.lineWidth=2;ctx.stroke()}
 path(xs,xs.map((_,i)=>gy(R[0][i]+R[1][i]+R[2][i]+R[3][i])));ctx.strokeStyle=COL.curve;ctx.lineWidth=2.25;ctx.lineJoin='round';ctx.shadowColor='rgba(232,237,242,.35)';ctx.shadowBlur=6;ctx.stroke();ctx.restore();
 const h=active(),circ=b=>{const c=posA(b),hot=h.band===b&&(h.zone==='BODY'||h.zone==='HP_LP_HANDLE');
  if(b===sel)ring(c.x,c.y,DOT);dot(c.x,c.y,DOT,hot?COL.hov:b===sel?COL.sel:COL.def,['HP','1','2','LP'][b])};
 for(let b=0;b<4;b++)if(b!==sel)circ(b);
 if(sel>=0){if(isBell(sel)){const c=posA(sel),o=qOffA(sel);LN(c.x-o,c.y,c.x+o,c.y,COL.sel,2);
  for(const s of[-1,1])CIR(c.x+s*o,c.y,QDOT,h.band===sel&&h.zone==='Q_HANDLE'&&h.side===s?COL.hov:COL.sel)}circ(sel)}
 if(sel>=0){const c=posA(sel),ln=readLines(sel),w=124,hh=ln.length*17+8,x=cl(c.x-w/2,AA.x+2,AA.x+AA.w-w-2);let y=c.y-DOT-12-hh;if(y<AA.y+2)y=c.y+DOT+12;box(x,y,w,hh,ln,12)}
}

/* ===== Layout B: vertical, depth-based ===== */
const BB={x:56,y:14,w:W-112,h:H-82},ppoB=BB.h/Math.log2(MAXF/MINF),cxB=BB.x+BB.w/2,baseW=BB.w*BASEFRAC,WL=cxB-WALLHALF,WR=cxB+WALLHALF;
const fy=f=>BB.y+BB.h-fNorm(f)*BB.h,yf=y=>normF((BB.y+BB.h-y)/BB.h);
function bellR(b){const v=bands[b],d=dScale(v.g),w=baseW*d,h=bwOct(v.q)*ppoB*BHS*d,y=fy(v.f);return{x:cxB-w/2,y:y-h/2,w,h,cy:y}}
function cutR(b){const y=fy(bands[b].f),x=cxB-baseW/2;return b===0?{x,y,w:baseW,h:BB.y+BB.h-y}:{x,y:BB.y,w:baseW,h:y-BB.y}}
const bFo=r=>r.w/2+Math.max(12,Math.min(STICK,WALLHALF-8-r.w/2));

function post(){page(`<h2>Final questions</h2><p>Which layout did you prefer?</p>${radios('pref',['A','B','No preference'])}<p>Why?<br><textarea id="why" style="height:70px"></textarea></p><p>Frequency felt natural when mapped vertically (up = higher).</p>${likert('vert','Strongly disagree','Strongly agree')}<p>Any other comments?<br><textarea id="cm" style="height:70px"></textarea></p>`,'Finish',finish,'pref,vert')}
const csvOf=(h,rs)=>h.join(',')+'\n'+rs.map(r=>r.map(x=>cq(String(x??''))).join(',')).join('\n');
function dl(){const tr=P.rows,t=tr.length?csvOf(Object.keys(tr[0]),tr.map(r=>Object.values(r))):'',q=P.qrow?csvOf(Object.keys(P.qrow),[Object.values(P.qrow)]):'';
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([[t,q,csvText()].join('\n\n')],{type:'text/csv'}));a.download=P.id+'.csv';a.click()}
function finish(){Object.assign(P.q,{preferred_layout:val('pref'),preference_reason:$('why').value,vertical_natural:val('vert'),comments:$('cm').value});
 const q={participant_id:P.id,timestamp:new Date().toISOString(),experience:P.exp,listening_device:P.dev,...P.q,assignment:assign,user_agent:navigator.userAgent,screen:screen.width+'x'+screen.height};P.qrow=q;
 send('questionnaire',Object.keys(q),[Object.values(q)]);
 card.innerHTML=`<h2>Thank you!</h2><p>Your responses have been submitted. Your participant ID is <b>${P.id}</b>. As a backup, you can download a copy of your data.</p><p><button id="dl">Download my data (CSV)</button></p>`;$('dl').onclick=dl}
function background(){page(`<h2>About you</h2><p>Audio production experience:</p>${radios('exp',['None','Beginner','Intermediate','Advanced'])}<p>What are you listening on?</p>${radios('dev',['Headphones','Earbuds','Speakers','Other'])}`,'Continue',()=>{P.exp=val('exp');P.dev=val('dev');prac('A')},'exp,dev')}
function begin(){panel('Welcome','',0);
 page(`<h2>Parametric EQ study</h2><p>You are invited to take part in a research study comparing two interface layouts for an audio equalizer. You will complete short listening and EQ tasks and answer a few questions (about 30-40 minutes).</p><p>Participation is voluntary and you may stop at any time by closing this page. No names are collected-- you are identified only by a random ID. Your interaction data and answers are used for research only.</p><p>Please use headphones or earbuds if you can, in a quiet place, and set your volume low before pressing Play.</p><p>By clicking "I agree" you consent to take part.</p>`,'I agree',()=>{TASKS.concat([PRACTICE]).forEach(t=>clip(t).catch(()=>{}));AC.resume();background()})}
setInterval(tick,100);ui();draw();begin();
</script></body></html>
